[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorysum"
version = "0.1.0"
description = "A source-faithful memory service for the Agent Memory Challenge textual track"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jieba>=0.42.1,<0.43",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "sqlite-vec>=0.1.6,<0.2",
  "tiktoken>=0.7,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
memorysum = "memorysum.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memorysum = ["config/*.json", "storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
